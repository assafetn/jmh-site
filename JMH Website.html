document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-border:          oklch(0.910 0.012 240);\n  --border-strong:   oklch(0.820 0.020 240);\n\n  /* ── TEXT ─────────────────────────────────────────── */\n  --text-primary:    oklch(0.20 0.035 245);\n  --text-secondary:  oklch(0.46 0.025 245);\n  --text-muted:      oklch(0.64 0.018 245);\n  --text-on-blue:    oklch(0.98 0.004 240);\n\n  /* ── ALIAS / SEMANTIC text ───────────────────────── */\n  --fg1:             var(--text-primary);\n  --fg2:             var(--text-secondary);\n  --fg3:             var(--text-muted);\n\n  /* ── TYPOGRAPHY ──────────────────────────────────── */\n  --font:            'DM Sans', system-ui, -apple-system, sans-serif;\n  --font-mono:       'JetBrains Mono', ui-monospace, 'Courier New', monospace;\n\n  /* Type scale (px) */\n  --text-xs:   11px;\n  --text-sm:   13px;\n  --text-base: 15px;\n  --text-md:   17px;\n  --text-lg:   20px;\n  --text-xl:   24px;\n  --text-2xl:  32px;\n  --text-3xl:  44px;\n  --text-4xl:  58px;\n\n  /* ── SPACING ─ 4px base ──────────────────────────── */\n  --sp-1: 4px;   --sp-2: 8px;   --sp-3: 12px;\n  --sp-4: 16px;  --sp-5: 20px;  --sp-6: 24px;\n  --sp-8: 32px;  --sp-10: 40px; --sp-12: 48px; --sp-16: 64px;\n\n  /* ── RADIUS ──────────────────────────────────────── */\n  --r-sm: 6px;\n  --r-md: 10px;\n  --r-lg: 16px;\n  --r-xl: 24px;\n  --r-full: 999px;\n\n  /* ── SHADOWS ─ tinted with primary blue ──────────── */\n  --shadow-sm: 0 1px 3px oklch(0.54 0.14 240 / 0.07), 0 1px 2px oklch(0.54 0.14 240 / 0.04);\n  --shadow-md: 0 4px 12px oklch(0.54 0.14 240 / 0.09), 0 2px 4px oklch(0.54 0.14 240 / 0.05);\n  --shadow-lg: 0 12px 32px oklch(0.54 0.14 240 / 0.10), 0 4px 8px oklch(0.54 0.14 240 / 0.06);\n  --shadow-xl: 0 24px 64px oklch(0.54 0.14 240 / 0.12), 0 8px 16px oklch(0.54 0.14 240 / 0.07);\n\n  /* ── MOTION ──────────────────────────────────────── */\n  --ease-out:  cubic-bezier(0.16, 1, 0.3, 1);  /* @kind other */\n  --ease-in:   cubic-bezier(0.7, 0, 0.84, 0);  /* @kind other */\n  --dur-fast:  120ms;  /* @kind other */\n  --dur-base:  220ms;  /* @kind other */\n  --dur-slow:  400ms;  /* @kind other */\n}\n\n/* ═══════════════════════════════════════════════════════════════\n   SEMANTIC TYPE STYLES — apply directly to elements\n═══════════════════════════════════════════════════════════════ */\n\n.jmh-display-hero {\n  /* \"Berlin, sorted.\" landing hero */\n  font-family: var(--font);\n  font-size: var(--text-4xl);\n  font-weight: 700;\n  letter-spacing: -0.04em;\n  line-height: 1.05;\n  color: var(--text-primary);\n}\n\n.jmh-display-light {\n  /* \"Intelligent guidance\" — display secondary */\n  font-family: var(--font);\n  font-size: var(--text-3xl);\n  font-weight: 300;\n  letter-spacing: -0.03em;\n  line-height: 1.1;\n  color: var(--text-primary);\n}\n\n.jmh-h1, h1.jmh {\n  font-family: var(--font);\n  font-size: var(--text-2xl);\n  font-weight: 700;\n  letter-spacing: -0.03em;\n  line-height: 1.15;\n  color: var(--text-primary);\n}\n\n.jmh-h2, h2.jmh {\n  font-family: var(--font);\n  font-size: var(--text-xl);\n  font-weight: 600;\n  letter-spacing: -0.02em;\n  line-height: 1.25;\n  color: var(--text-primary);\n}\n\n.jmh-h3, h3.jmh {\n  font-family: var(--font);\n  font-size: var(--text-lg);\n  font-weight: 600;\n  letter-spacing: -0.01em;\n  line-height: 1.3;\n  color: var(--text-primary);\n}\n\n.jmh-body, p.jmh {\n  font-family: var(--font);\n  font-size: var(--text-base);\n  font-weight: 400;\n  line-height: 1.65;\n  color: var(--text-secondary);\n}\n\n.jmh-body-strong {\n  font-family: var(--font);\n  font-size: var(--text-base);\n  font-weight: 500;\n  line-height: 1.55;\n  color: var(--text-primary);\n}\n\n.jmh-caption {\n  font-family: var(--font);\n  font-size: var(--text-sm);\n  line-height: 1.5;\n  color: var(--text-muted);\n}\n\n.jmh-overline {\n  font-family: var(--font);\n  font-size: var(--text-sm);\n  font-weight: 500;\n  letter-spacing: 0.10em;\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n.jmh-label {\n  font-family: var(--font);\n ding:13px 18px;min-height:0;opacity:0;transform:translateY(14px);transition:opacity .42s var(--eo),transform .42s var(--eo),background .25s var(--eo)\" style-hover=\"background:oklch(0.185 0.021 250)\">\n        <span style=\"font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;color:var(--blue-bright);font-variant-numeric:tabular-nums\">03<\u002Fspan>\n        <span style=\"display:block;font-size:15.5px;font-weight:600;letter-spacing:-.012em;color:var(--on-dark);margin-top:8px;max-width:34ch\">The answers aren't checkable<\u002Fspan>\n        <span style=\"display:block;padding-top:3px;font-size:13.5px;line-height:1.5;color:var(--on-dark-2);max-width:52ch\">Generic AI won't cite a source. Official sites won't explain your case.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n        <div data-rev=\"\" style=\"display:flex;min-width:0;opacity:0;transform:translateY(14px);transition:opacity .42s var(--eo),transform .42s var(--eo)\">\n          \n        <img src=\"bfd7e23c-bcaf-4a59-b505-36bbbd01ce8e\" alt=\"Illustration of a mover overwhelmed by browser tabs, PDFs and chat bubbles\" loading=\"lazy\" style=\"width: 413px; height: 410px; object-fit: fill; object-position: center; border-radius: 8px; border: 1px solid oklch(1 0 0 / 0.10)\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div style=\"position:relative;margin-top:clamp(10px,1.4vw,22px);overflow-x:auto;-webkit-overflow-scrolling:touch\">\n    \n  <svg sc-camel-view-box=\"0 0 1100 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Diagram: six conflicting sources converge on you; JMH resolves them into one plan, cited answers and watched deadlines\" style=\"display:block;width:100%;min-width:860px;height:auto;padding:0 clamp(20px,4vw,40px);overflow:visible\">\n      <defs>\n        <marker id=\"jmhArrow\" sc-camel-marker-width=\"8\" sc-camel-marker-height=\"7\" sc-camel-ref-x=\"7\" sc-camel-ref-y=\"3.5\" orient=\"auto\"><path d=\"M0 0 L8 3.5 ity .42s var(--eo)\" stroke=\"oklch(0.66 0.16 248 / 0.45)\" stroke-width=\"1.2\">\n        <line x1=\"754\" y1=\"200\" x2=\"788\" y2=\"200\"><\u002Fline>\n        <line x1=\"788\" y1=\"80\" x2=\"788\" y2=\"320\"><\u002Fline>\n        <line x1=\"788\" y1=\"80\" x2=\"796\" y2=\"80\"><\u002Fline>\n        <line x1=\"788\" y1=\"200\" x2=\"796\" y2=\"200\"><\u002Fline>\n        <line x1=\"788\" y1=\"320\" x2=\"796\" y2=\"320\"><\u002Fline>\n      <\u002Fg>\n      <g data-rev=\"\" style=\"opacity:0;transform:translateY(14px);transition:opacity .42s var(--eo),transform .42s var(--eo)\">\n        <rect x=\"796\" y=\"46\" width=\"222\" height=\"68\" rx=\"8\" fill=\"oklch(0.60 0.09 148 / 0.10)\" stroke=\"oklch(0.60 0.09 148 / 0.40)\"><\u002Frect>\n        <path d=\"M818 82 L824 88 L836 74\" fill=\"none\" stroke=\"oklch(0.74 0.09 148)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n        <text x=\"850\" y=\"78\" fill=\"oklch(0.86 0.07 148)\" font-family=\"'DM Sans',sans-serif\" font-size=\"14\" font-weight=\"600\">One plan<\u002Ftext>\n        <text x=\"850\" y=\"96\" fill=\"oklch(0.80 0.06 148 / 0.7)\" font-family=\"'DM Sans',sans-serif\" font-size=\"10.5\">in the only order that works<\u002Ftext>\n      <\u002Fg>\n      <g data-rev=\"\" style=\"opacity:0;transform:translateY(14px);transition:opacity .42s var(--eo),transform .42s var(--eo)\">\n        <rect x=\"796\" y=\"166\" width=\"222\" height=\"68\" rx=\"8\" fill=\"oklch(0.60 0.09 148 / 0.10)\" stroke=\"oklch(0.60 0.09 148 / 0.40)\"><\u002Frect>\n        <path d=\"M818 202 L824 208 L836 194\" fill=\"none\" stroke=\"oklch(0.74 0.09 148)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n        <text x=\"850\" y=\"198\" fill=\"oklch(0.86 0.07 148)\" font-family=\"'DM Sans',sans-serif\" font-size=\"14\" font-weight=\"600\">Cited answers<\u002Ftext>\n        <text x=\"850\" y=\"216\" fill=\"oklch(0.80 0.06 148 / 0.7)\" font-family=\"'DM Sans',sans-serif\" font-size=\"10.5\">source named, or no answer<\u002Ftext>\n      <\u002Fg>\n      <g data-rev=\"\" style=\"opacity:0;transform:translateY(14px);transition:opacity .42s var(--eo),transform .42s var(--eo)\">\n        <rect x=\"796\" y=\"286\" width=\"222\" height=\"68\" rx=\"8\" fill=\"oklch(0.60 0.09 148 / 0.10)\" stroke=\"oklch(0.60 0.09 148 / 0.40)\"><\u002Frect>\n        <path d=\"M818 322 L824 328 L836 314\" fill=\"none\" stroke=\"oklch(0.74 0.09 148)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n        <text x=\"850\" y=\"318\" fill=\"oklch(0.86 0.07 148)\" font-family=\"'DM Sans',sans-serif\" font-size=\"14\" font-weight=\"600\">Watched deadlines<\u002Ftext>\n        <text x=\"850\" y=\"336\" fill=\"oklch(0.80 0.06 148 / 0.7)\" font-family=\"'DM Sans',sans-serif\" font-size=\"10.5\">flagged before they close<\u002Ftext>\n      <\u002Fg>\n      <g data-rev=\"\" style=\"opacity:0;transition:opacity .42s var(--eo)\">\n        <text x=\"201\" y=\"392\" text-anchor=\"middle\" fill=\"oklch(0.58 0.02 245)\" font-family=\"'JetBrains Mono',monospace\" font-size=\"9.5\" font-weight=\"500\" letter-spacing=\"0.14em\">TODAY<\u002Ftext>\n        <text x=\"907\" y=\"392\" text-anchor=\"middle\" fill=\"oklch(0.74 0.07 148 / 0.85)\" font-family=\"'JetBrains Mono',monospace\" font-size=\"9.5\" font-weight=\"500\" letter-spacing=\"0.14em\">WITH JMH<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"market\" data-section=\"\" style=\"position:relative;overflow:hidden;background:var(--tint);padding:clamp(92px,10vw,144px) 0;border-top:1px solid var(--border-soft)\">\n  <div aria-hidden=\"true\" style=\"position:absolute;right:-.04em;bottom:-.24em;font-family:var(--disp);font-weight:700;font-size:clamp(180px,23vw,380px);line-height:.8;color:var(--ghost);pointer-events:none;user-select:none;font-variant-numeric:tabular-nums\">03<\u002Fdiv>\n  <div style=\"position:relative;max-width:1240px;margin:0 iew-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue-bright)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-top:3px\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"3\"><\u002Frect><path d=\"M8 3v4M16 3v4M3 10h18\"><\u002Fpath><\u002Fsvg>\n          <span style=\"display:block\">\n            <span style=\"display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em;color:var(--on-dark)\">Your dates, not a template<\u002Fspan>\n            <span style=\"display:block;font-size:14px;line-height:1.6;color:var(--on-dark-2);margin-top:2px\">Calculated from your situation, not a generic schedule.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"closer\" data-section=\"\" style=\"position:relative;overflow:hidden;background:var(--bg);border-top:1px solid var(--border-soft)\">\n  <div aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 60% at 50% 100%,oklch(0.93 0.028 240) 0%,transparent 72%)\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1240px;margin:0 auto;padding:clamp(100px,11vw,160px) clamp(20px,4vw,40px) clamp(80px,8vw,120px);display:flex;flex-direction:column;align-items:center\">\n    <img data-rev=\"\" src=\"0663724b-1e22-4229-97e8-11576b36bbef\" alt=\"Illustration of the mover arrived, keys in hand\" loading=\"lazy\" style=\"width:min(260px,60vw);margin-bottom:8px;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(ellipse 78% 78% at 50% 50%,#000 56%,transparent 100%);mask-image:radial-gradient(ellipse 78% 78% at 50% 50%,#000 56%,transparent 100%);opacity:0;transform:translateY(14px);transition:opacity .5s var(--eo),transform .5s var(--eo)\">\n    <span data-rev=\"\" style=\"display:block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--kick);opacity:0;transform:translateY(14px);transition:opacity .42s var(--eo),transform .42s var(--eo)\">Closer / 09<\u002Fspan>\n    <h2 data-rev=\"\" style=\"font-family:var(--disp);font-weight:700;font-size:clamp(2.7rem,5.2vw,4.6rem);line-height:1.03;letter-spacing:-.032em;color:var(--ink);text-align:center;max-width:15ch;margin:22px 0 24px;text-wrap:balance;opacity:0;transform:translateY(14px);transition:opacity .42s var(--eo),transform .42s var(--eo)\">Your move. <br>In the right order.<\u002Fh2>\n    <p data-rev=\"\" style=\"font-size:18px;line-height:1.7;color:var(--ink-2);text-align:center;max-width:52ch;margin:0 0 48px;text-wrap:pretty;opacity:0;transform:translateY(14px);transition:opacity .42s var(--eo),transform .42s var(--eo)\">One profile, one plan, one source of truth — the sequencing an agency sells, as software.<\u002Fp>\n\n    <div data-rev=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);opacity:0;transform:translateY(14px);transition:opacity .42s var(--eo),transform .42s var(--eo)\">\n      <span style=\"padding:16px 24px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);border-right:1px solid var(--border)\">Living Profile<\u002Fspan>\n      <span style=\"padding:16px 24px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);border-right:1px solid var(--border)\">The Plan<\u002Fspan>\n      <span style=\"padding:16px 24px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);border-right:1px solid var(--border)\">Cited Answers<\u002Fspan>\n      <span style=\"padding:16px 24px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)\">Proactive Engine<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;border-top:1px solid var(--border)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:22px clamp(20px,4vw,40px);display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n      <span style=\"width:24px;height:24px;border-radius:7px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700\">J<\u002Fspan>\n      <span style=\"font-size:13px;font-weight:700;color:var(--ink)\">JMH<\u002Fspan>\n      <span style=\"margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)\"><br><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;grainOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.045,&quot;min&quot;:0,&quot;max&quot;:0.12,&quot;step&quot;:0.005,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Texture&quot;},&quot;showProgressBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Chrome&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;orchestrated&quot;,&quot;instant&quot;],&quot;default&quot;:&quot;orchestrated&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.boot();\n    this.bindScroll();\n    this._fallback = setTimeout(() => this.revealAll(), 2200);\n  }\n  componentDidUpdate() { this.boot(); }\n  componentWillUnmount() {\n    clearTimeout(this._fallback);\n    clearInterval(this._onbTimer);\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._io) this._io.disconnect();\n  }\n\n  boot() {\n    if (!this._io) {\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (!e.isIntersecting) return;\n          this._io.unobserve(e.target);\n          this.play(e.target);\n        });\n      }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });\n    }\n    document.querySelectorAll('[data-section]:not([data-obs])').forEach((s) => {\n      s.setAttribute('data-obs', '1');\n      this._io.observe(s);\n    });\n    // any element re-created after its section already played would stay hidden — sweep those\n    document.querySelectorAll('[data-section][data-played] [data-rev]').forEach((el) => {\n      if (getComputedStyle(el).opacity === '0') { el.style.opacity = '1'; el.style.transform = 'none'; }\n    });\n    this.initOnboarding();\n    this.initMicro();\n    this.initNav();\n    this.initCounters();\n    this.applyProps();\n  }\n\n  applyProps() {\n    const root = document.getElementById('jmh');\n    if (root) root.style.setProperty('--grain-op', String(this.props.grainOpacity ?? 0.045));\n    const bar = document.getElementById('jmh-progress');\n    if (bar) bar.style.display = (this.props.showProgressBar ?? true) ? 'block' : 'none';\n    if ((this.props.motion ?? 'orchestrated') === 'instant' && !this._instant) {\n      this._instant = true;\n      this.reduced = true;\n      this.revealAll();\n    }\n  }\n\n  play(sec) {\n    sec.setAttribute('data-played', '1');\n    const els = Array.from(sec.querySelectorAll('[data-rev]'));\n    const step = this.reduced ? 0 : 55;\n    els.forEach((el, i) => {\n      el.style.transitionDelay = Math.min(i, 16) * step + 'ms';\n      el.style.opacity = '1';\n      el.style.transform = 'none';\n    });\n  }\n\n  revealAll() {\n    document.querySelectorAll('[data-rev]').forEach((el) => {\n      el.style.opacity = '1';\n      el.style.transform = 'none';\n    });\n  }\n\n  bindScroll() {\n    const bar = document.getElementById('jmh-progress');\n    const nav = document.getElementById('jmh-nav');\n    this._onScroll = () => {\n      const h = document.documentElement.scrollHeight - window.innerHeight;\n      const p = h > 0 ? Math.min(window.scrollY / h, 1) : 0;\n      if (bar) bar.style.transform = 'scaleX(' + p + ')';\n      if (nav) nav.style.borderBottomColor = window.scrollY > 60 ? 'oklch(0.885 0.008 250)' : 'transparent';\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  initNav() {\n    if (this._navDone) return;\n    const links = Array.from(document.querySelectorAll('[data-nav-to]'));\n    if (!links.length) return;\n    const targets = ['problem', 'market', 'product'].map((id) => document.getElementById(id)).filter(Boolean);\n    if (targets.length < 3) return;\n    this._navDone = true;\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        links.forEach((l) => {\n          const on = l.getAttribute('data-nav-to') === e.target.id;\n          l.style.color = on ? 'oklch(0.54 0.14 240)' : 'oklch(0.605 0.016 250)';\n          l.style.borderBottomColor = on ? 'oklch(0.54 0.14 240)' : 'transparent';\n        });\n      });\n    }, { rootMargin: '-40% 0px -55% 0px' });\n    targets.forEach((t) => io.observe(t));\n  }\n\n  initCounters() {\n    document.querySelectorAll('[data-count]:not([data-cdone])').forEach((el) => {\n      el.setAttribute('data-cdone', '1');\n      const target = parseFloat(el.getAttribute('data-count'));\n      const run = () => {\n        if (el.__fired) return;\n        el.__fired = true;\n        if (this.reduced) { el.textContent = String(target); return; }\n        const t0 = performance.now(), dur = 1000;\n        const tick = (t) => {\n          const p = Math.min((t - t0) / dur, 1);\n          el.textContent = String(Math.round(target * (1 - Math.pow(1 - p, 3))));\n          if (p < 1) requestAnimationFrame(tick);\n        };\n        requestAnimationFrame(tick);\n      };\n      this._obs = this._obs || [];\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => { if (e.isIntersecting) { io.disconnect(); run(); } });\n      }, { threshold: 0.6 });\n      this._obs.push(io);\n      io.observe(el);\n      setTimeout(run, 2400);\n    });\n  }\n\n  initOnboarding() {\n    if (this._onbTimer || this.reduced) return;\n    const wrap = document.getElementById('jmh-onb');\n    if (!wrap) return;\n    const steps = Array.from(wrap.querySelectorAll('.jmh-onb-step'));\n    if (steps.length < 2) return;\n    let i = 0;\n    const paint = (s) => {\n      const f = s.querySelector('.jmh-onb-fill');\n      if (f) requestAnimationFrame(() => { f.style.width = s.getAttribute('data-fill') + '%'; });\n    };\n    paint(steps[0]);\n    this._onbTimer = setInterval(() => {\n      steps[i].style.opacity = '0';\n      steps[i].style.transform = 'translateX(-14px)';\n      steps[i].style.pointerEvents = 'none';\n      i = (i + 1) % steps.length;\n      const n = steps[i];\n      const f = n.querySelector('.jmh-onb-fill');\n      if (f) f.style.width = '23%';\n      n.style.transform = 'translateX(16px)';\n      requestAnimationFrame(() => {\n        n.style.opacity = '1';\n        n.style.transform = 'none';\n        n.style.pointerEvents = 'auto';\n        paint(n);\n      });\n    }, 4200);\n  }\n\n  once(id, fn, thr) {\n    const el = document.getElementById(id);\n    if (!el || el.getAttribute('data-mi')) return;\n    el.setAttribute('data-mi', '1');\n    this._obs = this._obs || [];\n    const run = () => { if (el.__fired) return; el.__fired = true; fn(el); };\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        io.disconnect();\n        setTimeout(run, this.reduced ? 0 : 1200);\n      });\n    }, { threshold: thr || 0.5 });\n    this._obs.push(io);\n    io.observe(el);\n    setTimeout(run, 2600);\n  }\n\n  initMicro() {\n    this.once('jmh-pf-row', (row) => {\n      const v = document.getElementById('jmh-pf-value');\n      const pill = document.getElementById('jmh-pf-pill');\n      if (v) v.textContent = 'Partner + 1 child';\n      row.style.background = 'oklch(0.968 0.013 240)';\n      if (pill) { pill.style.opacity = '1'; pill.style.transform = 'none'; }\n      setTimeout(() => { row.style.background = 'transparent'; }, 2800);\n    }, 0.55);\n\n    this.once('jmh-plan-tick', (task) => {\n      const dot = task.querySelector('[data-dot]');\n      const check = task.querySelector('[data-check]');\n      const title = task.querySelector('[data-title]');\n      if (dot) { dot.style.background = 'oklch(0.60 0.09 148)'; dot.style.borderColor = 'oklch(0.60 0.09 148)'; }\n      if (check) check.style.opacity = '1';\n      if (title) { title.style.color = 'oklch(0.46 0.022 250)'; title.style.textDecoration = 'line-through'; title.style.fontWeight = '500'; }\n      setTimeout(() => {\n        const fill = document.getElementById('jmh-plan-fill');\n        const count = document.getElementById('jmh-plan-count');\n        const pct = document.getElementById('jmh-plan-pct');\n        if (fill) fill.style.width = '36%';\n        if (count) count.textContent = '4 of 11 tasks complete';\n        if (pct) pct.textContent = '36%';\n      }, this.reduced ? 0 : 420);\n    }, 0.5);\n\n    this.once('jmh-chat-answer', (wrap) => {\n      const typing = wrap.querySelector('[data-typing]');\n      const answer = wrap.querySelector('[data-answer]');\n      if (typing) typing.style.display = 'none';\n      if (answer) { answer.style.display = 'block'; requestAnimationFrame(() => { answer.style.opacity = '1'; answer.style.transform = 'none'; }); }\n    }, 0.5);\n\n    this.once('jmh-alert-card', (card) => {\n      card.style.opacity = '1';\n      card.style.transform = 'none';\n    }, 0.5);\n  }\n\n  renderVals() { return {}; }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
